[package]
name = "folio-native"
description = "Folio's native carousel editor"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[dependencies]
canopy-ui = { path = "../../canopy/native/crates/canopy-ui" }
egui = "0.37.0"
eframe = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22.1"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
